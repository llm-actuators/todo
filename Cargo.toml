[package]
name = "todo"
version = "0.1.0"
edition = "2021"
description = "Priority-aware Markdown-backed todo list for substrate cohort coordination."

[[bin]]
name = "todo"
path = "src/main.rs"

[lib]
name = "todo"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = { level = "deny", priority = -1 }
